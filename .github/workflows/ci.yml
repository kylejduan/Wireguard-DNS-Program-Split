# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      privileged_linux:
        description: Run on an operator-provisioned disposable Ubuntu 26.04 kernel 7.0 VM
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-unit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libbpf-dev libelf-dev zlib1g-dev
      - name: Run Linux unit and native parsing checks
        run: ./tests/run-linux.sh
  linux-privileged:
    if: github.event_name == 'workflow_dispatch' && inputs.privileged_linux
    runs-on: [self-hosted, linux, wgps-disposable-vm]
    steps:
      - uses: actions/checkout@v4
      - name: Run real kernel and network acceptance
        run: sudo env WG_CLASSIFIER_DISPOSABLE_VM=1 ./tests/run-linux.sh --vm
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git mingw-w64-ucrt-x86_64-gcc
      - name: Build and run native checks
        timeout-minutes: 10
        shell: msys2 {0}
        run: |
          CXX=g++ ./scripts/build-wsl.sh
          ./build/controller-service.exe --self-test
          ./build/dns-dispatcher.exe --self-test
          ./build/dns-probe.exe --self-test
          ./build/wfp-probe.exe --self-test
          ./build/tray.exe --self-test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode tests/native/tray-backstop.cpp -o build/test-tray-backstop.exe -lcrypt32
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode tests/native/tray-supervisor.cpp -o build/test-tray-supervisor.exe -lcrypt32
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode tests/native/tray-host-lifecycle.cpp -o build/test-tray-host-lifecycle.exe -lcrypt32
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode -mwindows -DWGPS_TRAY_TEST_INSTANCE src/native/tray.cpp -o build/test-tray-ui.exe -lshell32 -lcomdlg32 -luser32 -lcrypt32 -lole32
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode tests/native/tray-session.cpp -o build/test-tray-session.exe -lshell32 -lcomdlg32 -luser32 -lcrypt32 -lole32
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode tests/native/tray-stub.cpp -o build/test-tray-stub.exe
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode tests/native/tray-action.cpp -o build/test-tray-action.exe -lcrypt32
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode tests/native/tray-dialog.cpp -o build/test-tray-dialog.exe -lcrypt32
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode tests/native/pending-service.cpp -o build/test-pending-service.exe
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static tests/native/dns-responder.cpp -o build/test-dns-responder.exe -lws2_32
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static tests/native/net-probe.cpp -o build/test-net-probe.exe -lws2_32 -ldnsapi
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode tests/native/dns-load.cpp -o build/test-dns-load.exe -lws2_32 -ldnsapi
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode -DWGPS_DNS_TEST_STALL_IMAGES src/native/dns-dispatcher.cpp -o build/test-dns-stall-dispatcher.exe -lws2_32 -ltdh
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static tests/native/wfp-callout-holder.cpp -o build/test-wfp-callout-holder.exe -lfwpuclnt -lrpcrt4 -lole32
      - name: Build the pre-hardening DNS regression baseline
        shell: msys2 {0}
        run: |
          git fetch --no-tags --depth=1 origin dd5ddfa8beca0c0ef2fe5e1c99d637a3bec96741
          mkdir -p build/dns-baseline
          git archive dd5ddfa8beca0c0ef2fe5e1c99d637a3bec96741 src/native | tar -x -C build/dns-baseline
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -static -municode build/dns-baseline/src/native/dns-dispatcher.cpp -o build/baseline-dns-dispatcher.exe -lws2_32 -ltdh
      - name: Run PowerShell checks
        shell: powershell
        run: |
          ./tests/Test-PowerShell.ps1 -RepositoryRoot $PWD
          ./tests/Test-TcpListener.ps1 -RepositoryRoot $PWD
          ./tests/Test-NetworkRecovery.ps1 -RepositoryRoot $PWD
          ./tests/Test-NetworkRecoveryExecution.ps1 -RepositoryRoot $PWD
          ./tests/Test-RepairPolicy.ps1 -RepositoryRoot $PWD
          ./tests/Test-TunnelRecovery.ps1 -RepositoryRoot $PWD
          ./tests/Test-RecoveryStability.ps1 -RepositoryRoot $PWD
          ./tests/Test-ControllerHealth.ps1 -RepositoryRoot $PWD
          ./tests/Test-InstallLayout.ps1 -RepositoryRoot $PWD
          ./tests/Test-InstallPaths.ps1 -RepositoryRoot $PWD
          ./tests/Test-ProcessIdentity.ps1 -RepositoryRoot $PWD
          ./tests/Test-ValidationWorker.ps1 -RepositoryRoot $PWD
          ./tests/Test-AdapterMaintenance.ps1 -RepositoryRoot $PWD
          ./tests/Test-TunnelPreflight.ps1 -RepositoryRoot $PWD
          ./tests/Test-StateFiles.ps1 -RepositoryRoot $PWD
          ./tests/Test-ResourceLimits.ps1 -RepositoryRoot $PWD
          ./tests/Test-Tray.ps1 -RepositoryRoot $PWD
          ./tests/Test-TrayMaintenance.ps1 -RepositoryRoot $PWD
      - name: Exercise real Windows service lifecycles
        shell: powershell
        run: |
          ./tests/Test-TunnelRecoveryLive.ps1 -TunnelScript "$PWD/src/powershell/Invoke-Tunnel.ps1" -StubService "$PWD/build/test-pending-service.exe"
          ./tests/Test-ControllerServiceLive.ps1 -RepositoryRoot $PWD
          ./tests/Test-DnsDispatcherLive.ps1 -RepositoryRoot $PWD
          ./tests/Test-WfpFiltersLive.ps1 -RepositoryRoot $PWD
          ./tests/Test-DispatcherSupervisorLive.ps1 -RepositoryRoot $PWD
      - name: Prove DNS outage isolation against the pre-fix baseline
        shell: powershell
        run: |
          ./tests/Test-DnsCapacityLive.ps1 -RepositoryRoot $PWD -Dispatcher "$PWD/build/baseline-dns-dispatcher.exe" -ExpectStarvation
          ./tests/Test-DnsCapacityLive.ps1 -RepositoryRoot $PWD -Dispatcher "$PWD/build/dns-dispatcher.exe"
          ./tests/Test-DnsCapacityLive.ps1 -RepositoryRoot $PWD -Dispatcher "$PWD/build/test-dns-stall-dispatcher.exe" -ImageStalls
      - name: Check public tree
        shell: msys2 {0}
        run: ./tests/check-public-tree.sh
